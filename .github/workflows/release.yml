name: Release

# 优化版（对比原 publish.yml）：原流程只做「同步 root 版本 → npm publish」，测试要靠
# test.yml 恰好绿着。本流程把一次 v* tag 推送变成完整发布流水线：
#
#   verify（版本号管理）→ test（双平台全量测试，矩阵同 CI）→ publish（npm）→ release（GitHub Release）→ notify（结果摘要）
#
# 沿用 publish.yml 的血泪教训并固化成步骤：
#   1. 发布根是 dsh-mneme/ 子目录（真实版本在 dsh-mneme/package.json，prepack 自动
#      npm run sync 同步 src→lib）——npm publish 在 dsh-mneme/ 下跑，包结构与
#      v0.7.12/0.7.13 本机发布一致；root 的编排壳 package.json 已删除（曾停在
#      0.7.x，任何指向仓库根的 link/junction 都会静默加载旧包，勿再引入）。
#   2. 「skip if exists」幂等守卫：同一版本重复推 tag 不会重复发布。
#
# 新增的版本号管理规则：
#   - tag 必须与 dsh-mneme/package.json version 完全一致（vX.Y.Z ↔ X.Y.Z），否则直接失败；
#   - tag 对应版本必须在 dsh-mneme/CHANGELOG.md 里有小节（文档先行，发布时自动抽取作 Release 说明）。
#
# 手动触发（workflow_dispatch）支持 dry_run：只跑 verify + test，不发布不建 Release。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只验证 + 测试，不发布（dry run）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ── 1. 版本号管理：tag ↔ package.json ↔ CHANGELOG 三方一致 ──────────────
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve version (tag push or package.json)
        id: ver
        run: |
          PKG_V="$(node -p "require('./dsh-mneme/package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_V="${GITHUB_REF_NAME#v}"
            echo "tag=v$TAG_V, package.json=$PKG_V"
            if [ "$TAG_V" != "$PKG_V" ]; then
              echo "::error::tag v$TAG_V 与 dsh-mneme/package.json 版本 $PKG_V 不一致"
              exit 1
            fi
            echo "version=$PKG_V" >> "$GITHUB_OUTPUT"
          else
            echo "version=$PKG_V" >> "$GITHUB_OUTPUT"
          fi

      # 文档更新守门：CHANGELOG 缺该版本小节 → 说明发布说明没写，阻断并提示
      - name: CHANGELOG has a section for this version
        run: |
          V="${{ steps.ver.outputs.version }}"
          if ! grep -qE "^## \[${V}\]" dsh-mneme/CHANGELOG.md; then
            echo "::error::dsh-mneme/CHANGELOG.md 缺少 ## [${V}] 小节——请先补发布说明"
            exit 1
          fi
          echo "CHANGELOG section found for ${V}"

  # ── 2. 双平台全量测试（Windows + Linux × Node 22/24，与 CI 同矩阵）────────
  test:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: dsh-mneme
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: dsh-mneme/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync check (src ↔ lib)
        run: node scripts/check-sync.js

      - name: Full test suite
        run: npm test

  # ── 3. 发布到 npm（沿用原 publish.yml 的同步与幂等守卫）──────────────────
  publish:
    needs: [verify, test]
    if: github.event_name == 'push' || inputs.dry_run != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Registry current state (diagnostic)
        run: |
          npm view @modusensus/dsh-mneme versions --json || true
          npm view @modusensus/dsh-mneme time --json || true

      # 发布根 = dsh-mneme/（dsh-mneme/package.json 是真实版本 + prepack `npm run sync` 自动同步
      # src→lib），与 v0.7.12/0.7.13 本机发布包结构一致；root 壳不参与发布，无需 root 版本同步
      - name: Publish @modusensus/dsh-mneme (skip if exists)
        working-directory: dsh-mneme
        run: |
          V="${{ needs.verify.outputs.version }}"
          if npm view "@modusensus/dsh-mneme@${V}" version >/dev/null 2>&1; then
            echo "v${V} already published on registry — skipping"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 真闸门：拿不到这个版本就非零退出，让 job 变红。
      # 原先这里是 `echo "Published: $(npm view "@modusensus/dsh-mneme@${V}" version)"` —— 命令
      # 替换里的失败**不会**让 `set -e` 退出：v0.8.16 那次日志白纸黑字写着
      # `npm error code E404 / 404 No match found for version 0.8.16`，step 与 job 却都是绿的。
      # 闸门必须能区分「发出去了」与「没发出去」，而两者当时是同一种颜色。
      # 轮询而不是一次性查询：registry 有传播延迟（v0.8.16 实测 publish→可见约 4.5 分钟），
      # 一次性查询只有假绿或假红两种结局；幂等跳过路径首次探测即通过，不付等待成本。
      - name: Verify published version (blocking gate)
        run: node dsh-mneme/scripts/publish-gate.mjs "${{ needs.verify.outputs.version }}"

  # ── 4. GitHub Release（按 v0.7.9 / v0.7.10 的既定格式，说明自动取自 CHANGELOG）──
  release:
    needs: [verify, test]
    if: github.event_name == 'push' || inputs.dry_run != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 从 dsh-mneme/CHANGELOG.md 抽取本版本小节作为 Release 说明（verify 已保证存在）
      - name: Extract release notes from CHANGELOG
        run: |
          V="${{ needs.verify.outputs.version }}"
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            const md = fs.readFileSync("dsh-mneme/CHANGELOG.md", "utf8");
            const re = new RegExp("^## \\[" + v.replace(/\./g, "\\.") + "\\][^\\n]*\\n", "m");
            const start = md.search(re);
            if (start === -1) { console.error("changelog section not found: " + v); process.exit(1); }
            const rest = md.slice(start + md.slice(start).indexOf("\n") + 1);
            const next = rest.search(/^## \[/m);
            const body = (next === -1 ? rest : rest.slice(0, next)).trim();
            fs.mkdirSync("notes", { recursive: true });
            fs.writeFileSync("notes/body.md", body + "\n");
            console.log("--- extracted notes ---\n" + body.slice(0, 400));
          ' "$V"

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # 标题统一纯版本号（v0.7.9 基准，9/8 决定）；Release 正文由
          # 上方抽取的 CHANGELOG 分类小节提供（## 🆕 新功能 / 🐛 修复 / 🏗️ 工程 / 📦 升级提示）
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release edit "v${VERSION}" --title "v${VERSION}" --notes-file notes/body.md
          else
            gh release create "v${VERSION}" --title "v${VERSION}" --notes-file notes/body.md
          fi

  # ── 5. 通知与运行摘要（接入外部通知时往这里加一步 webhook 即可）────────────
  #    徽章对齐不在流水线里做：main 受保护（4 个必过检查 + strict + 线性历史），
  #    github-actions[bot] 的 GITHUB_TOKEN 绕过不了 required status checks，
  #    push 必被 GH006 拒（v0.8.3 实测），改由发版前本地跑 npm run badge:sync，
  #    与人工发布同一次提交带上。
  notify:
    needs: [verify, test, publish, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Job summary
        run: |
          {
            echo "## Release pipeline — ${{ needs.verify.outputs.version }}"
            echo ""
            echo "| job | result |"
            echo "|-----|--------|"
            echo "| verify | ${{ needs.verify.result }} |"
            echo "| test (win/linux × node 22/24) | ${{ needs.test.result }} |"
            echo "| publish (npm) | ${{ needs.publish.result }} |"
            echo "| release (GitHub) | ${{ needs.release.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      # 可选：企业微信/Telegram/邮件 webhook。配置 secret（如 NOTIFY_WEBHOOK）后取消注释：
      # - name: Notify webhook
      #   if: needs.publish.result == 'success'
      #   run: |
      #     curl -sf -X POST "${{ secrets.NOTIFY_WEBHOOK }}" \
      #       -H 'Content-Type: application/json' \
      #       -d '{"msgtype":"text","text":{"content":"dsh-mneme ${{ needs.verify.outputs.version }} 已发布"}}'
